<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>53 Man Roster Tournament - 2026</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="{{ '/css/style.css' | url }}">
  <link rel="icon" type="image/png" href="{{ '/img/hwpicon.png' | url }}">
</head>
<body>

  <!-- ===== Home/Landing View ===== -->
  <div id="home-view">
    <div class="hero-content text-center sunshine">
      <div class="logo-frame-container">
        <img src="{{ '/img/hwplogo.png' | url }}" alt="Hops with Pop Logo" class="hero-logo">
      </div>
      <h1 class="display-3 fw-bold">53 Man Roster Tournament</h1>
      <p class="lead">2026 LA Chargers</p>

      <!-- Auth: signed-out state -->
      <div id="auth-signed-out" class="mt-4 d-none">
        <p style="color:#fff; opacity:0.85;">Sign in to make your picks.</p>
        <button id="btn-google-signin" class="btn btn-light mt-2" style="min-width:240px;">
          <span style="display:inline-flex; align-items:center; gap:8px;">
            <svg width="18" height="18" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg"><path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844a4.14 4.14 0 0 1-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.615z"/><path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.964 10.706A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.706V4.962H.957A8.997 8.997 0 0 0 0 9c0 1.452.348 2.827.957 4.038l3.007-2.332z"/><path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.962L3.964 7.294C4.672 5.167 6.656 3.58 9 3.58z"/></svg>
            Sign in with Google
          </span>
        </button>
        <div class="mt-3 d-flex justify-content-center align-items-center" style="gap:8px;">
          <hr style="flex:1; border-color:rgba(255,255,255,0.4); max-width:80px;">
          <span style="color:#fff; opacity:0.7; font-size:0.85rem;">or</span>
          <hr style="flex:1; border-color:rgba(255,255,255,0.4); max-width:80px;">
        </div>
        <form id="email-link-form" class="mt-2" style="max-width:340px; margin:0 auto;">
          <input type="email" id="email-input" class="form-control" placeholder="you@example.com" required>
          <button type="submit" class="btn btn-outline-light mt-2" style="min-width:240px;">Email me a sign-in link</button>
          <div id="email-link-status" class="mt-2" style="color:#fff; font-size:0.9rem;"></div>
        </form>
      </div>

      <!-- Auth: signed-in state -->
      <div id="auth-signed-in" class="mt-4 d-none">
        <p style="color:#fff; opacity:0.85;">Signed in as <span id="signed-in-email" style="font-weight:500;"></span></p>
        <button id="btn-start" class="btn btn-lg btn-outline-light mt-2">Make Your Picks</button>
        <button id="btn-signout" class="btn btn-sm btn-link mt-2 d-block mx-auto" style="color:#fff;">Sign out</button>
      </div>

      <!-- Auth: loading state -->
      <div id="auth-loading" class="mt-4">
        <div class="spinner-border text-light" role="status"><span class="visually-hidden">Loading...</span></div>
      </div>

      <a href="{{ '/2025/' | url }}" class="btn btn-sm btn-outline-light mt-4 d-block mx-auto" style="max-width:200px;">View 2025 Results</a>
    </div>
  </div>

  <!-- ===== Selection View (placeholder until 90-man roster is set) ===== -->
  <div id="selection-view" class="d-none">
    <header class="sticky-top shadow-sm" id="selection-header">
      <div class="container-fluid">
        <div class="d-flex justify-content-between align-items-center p-2">
            <div class="d-flex align-items-center">
                <span id="selection-user-email" class="text-muted small"></span>
            </div>
            <div class="counts-display text-center">
                <span class="badge bg-roster me-2">Roster: <span id="rosterCount">0</span>/53</span>
                <span class="badge bg-squad">P. Squad: <span id="squadCount">0</span>/16</span>
            </div>
            <button id="submitBtn" class="btn btn-primary btn-sm" disabled>Submit</button>
        </div>
        <nav id="position-nav" class="nav nav-pills flex-nowrap"></nav>
      </div>
    </header>

    <main class="container-fluid mt-4" id="player-selection-area">
      <section id="rules-section">
        <div class="text-center mb-5">
          <h2 class="rules-main-title">Predictions Open When the 90-Man Roster Is Set</h2>
          <p class="lead text-muted">Check back closer to training camp.</p>
          <button id="backBtn" class="btn btn-secondary mt-3">Back</button>
        </div>
      </section>
    </main>
  </div>

  <script>
    window.firebaseConfig = {
      apiKey: "{{ env.FIREBASE_API_KEY }}",
      authDomain: "{{ env.FIREBASE_AUTH_DOMAIN }}",
      projectId: "{{ env.FIREBASE_PROJECT_ID }}",
      storageBucket: "{{ env.FIREBASE_STORAGE_BUCKET }}",
      messagingSenderId: "{{ env.FIREBASE_MESSAGING_SENDER_ID }}",
      appId: "{{ env.FIREBASE_APP_ID }}",
      measurementId: "{{ env.FIREBASE_MEASUREMENT_ID }}"
    };
  </script>

  <!-- Firebase + Bootstrap -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <!-- App scripts -->
  <script src="{{ '/2026/js/auth.js' | url }}"></script>
  <script src="{{ '/2026/js/app.js' | url }}"></script>
</body>
</html>
